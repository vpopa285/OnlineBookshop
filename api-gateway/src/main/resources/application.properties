spring.application.name=api-gateway
server.port=${SERVER_PORT}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

spring.cloud.gateway.server.webmvc.routes[0].id=book-service-api
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://book-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/books/**,/books/**,/api/reviews/**,/reviews/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.name=bookServiceGateway
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/book-service
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.statusCodes[0]=500
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.statusCodes[1]=502
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.statusCodes[2]=503
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.statusCodes[3]=504

spring.cloud.gateway.server.webmvc.routes[1].id=user-service-api
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**,/users/**,/api/orders/**,/orders/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.name=userServiceGateway
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/user-service
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.statusCodes[0]=500
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.statusCodes[1]=502
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.statusCodes[2]=503
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.statusCodes[3]=504

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.bookServiceGateway.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.bookServiceGateway.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.bookServiceGateway.slidingWindowSize=10
resilience4j.circuitbreaker.instances.bookServiceGateway.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.bookServiceGateway.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bookServiceGateway.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.bookServiceGateway.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.userServiceGateway.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userServiceGateway.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.userServiceGateway.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userServiceGateway.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userServiceGateway.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceGateway.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userServiceGateway.permittedNumberOfCallsInHalfOpenState=3

debug=false

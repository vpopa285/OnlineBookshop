services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    environment:
      SERVER_PORT: ${EUREKA_SERVER_PORT}
    ports:
      - "${EUREKA_SERVER_PORT}:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 5s
      timeout: 5s
      retries: 12

  book-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - book_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  book-service:
    build:
      context: .
      dockerfile: book-service/Dockerfile
    depends_on:
      eureka-server:
        condition: service_healthy
      book-db:
        condition: service_healthy
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${BOOK_SERVICE_PORT}
      DB_HOST: book-db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
    ports:
      - "${BOOK_SERVICE_PORT}:${BOOK_SERVICE_PORT}"

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${USER_SERVICE_PORT}
      DB_HOST: user-db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      eureka-server:
        condition: service_healthy
      book-service:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      SERVER_PORT: ${API_GATEWAY_PORT:-8080}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"

volumes:
  book_postgres_data:
  user_postgres_data:

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_STACK_VERSION}
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${LOGSTASH_PORT}:5005"
      - "${LOGSTASH_API_PORT}:9600"
    volumes:
      - ./infrastructure/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./infrastructure/logstash/pipeline:/usr/share/logstash/pipeline:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ruby -rnet/http -e 'exit Net::HTTP.get_response(URI(\"http://localhost:9600/_node/pipelines\")).is_a?(Net::HTTPSuccess) ? 0 : 1'"
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION}
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT}:5601"

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    depends_on:
      api-gateway:
        condition: service_started
      book-service:
        condition: service_started
      user-service:
        condition: service_started
      eureka-server:
        condition: service_started
    volumes:
      - ./infrastructure/prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - prometheus_data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed \
          -e 's|__API_GATEWAY_PORT__|${API_GATEWAY_PORT}|g' \
          -e 's|__BOOK_SERVICE_PORT__|${BOOK_SERVICE_PORT}|g' \
          -e 's|__USER_SERVICE_PORT__|${USER_SERVICE_PORT}|g' \
          -e 's|__EUREKA_SERVER_PORT__|${EUREKA_SERVER_PORT}|g' \
          /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles \
          --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT}:9090"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    depends_on:
      logstash:
        condition: service_healthy
    environment:
      SERVER_PORT: ${EUREKA_SERVER_PORT}
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5005
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${EUREKA_SERVER_PORT}:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 5s
      timeout: 5s
      retries: 12

  book-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - book_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  book-service:
    build:
      context: .
      dockerfile: book-service/Dockerfile
    depends_on:
      eureka-server:
        condition: service_healthy
      book-db:
        condition: service_healthy
      logstash:
        condition: service_healthy
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${BOOK_SERVICE_PORT}
      DB_HOST: book-db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5005
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${BOOK_SERVICE_PORT}:${BOOK_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
      logstash:
        condition: service_healthy
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${USER_SERVICE_PORT}
      DB_HOST: user-db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      BOOK_SERVICE_URL: ${BOOK_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5005
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      eureka-server:
        condition: service_healthy
      book-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      logstash:
        condition: service_healthy
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${API_GATEWAY_PORT}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5005
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"

volumes:
  elasticsearch_data:
  book_postgres_data:
  user_postgres_data:
  prometheus_data:
  grafana_data:

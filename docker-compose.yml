services:
  book-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - book_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  book-service:
    build:
      context: .
      dockerfile: book-service/Dockerfile
    depends_on:
      book-db:
        condition: service_healthy
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${BOOK_SERVICE_PORT}
      DB_HOST: book-db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
    ports:
      - "${BOOK_SERVICE_PORT}:${BOOK_SERVICE_PORT}"

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${USER_SERVICE_PORT}
      DB_HOST: user-db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BOOK_SERVICE_URL: ${BOOK_SERVICE_URL}
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"

volumes:
  book_postgres_data:
  user_postgres_data:

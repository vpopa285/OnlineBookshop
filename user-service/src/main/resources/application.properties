spring.profiles.active=${ACTIVE_PROFILE}
spring.application.name=user-service

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

clients.book-service.url=${BOOK_SERVICE_URL}

management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY}
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT}
management.health.circuitbreakers.enabled=true

debug=false
